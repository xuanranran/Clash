# Stash 专用基础模板；策略组和路由规则由 ClashRule_Stash.ini 生成。
# 原生转换使用 target=stash 与 stash_rule_base。
# 监听端口、局域网访问、控制接口与网络增强在 Stash 客户端设置中管理。
# DNS: https://stash.wiki/features/dns-server
# 不使用 rcode://、geoip: DNS 策略或 Mihomo 的有序 fake-ip 规则模式。
# fake-ip-filter 是排除清单：命中者返回真实 IP，其余保持 Stash 默认 Fake-IP。
# STUN 正则以兼容通配符表示；它可能比原正则多匹配少量主机名。
# geosite/rule-set 排除项重叠时无法复现 Mihomo 中显式 fake-ip 的覆盖顺序。
mode: rule
log-level: debug
ipv6: true
hosts:
  "*.clash.dev": 127.0.0.1
dns:
  default-nameserver:
    - 223.6.6.6
    - 180.184.1.1
    - 114.114.114.114
  nameserver:
    - "https://223.6.6.6/dns-query#h3=true"
    - "https://dns.alidns.com/dns-query#h3=true"
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query#h3=true"
    - "https://223.6.6.6/dns-query#h3=true"
    - https://doh.pub/dns-query
  fallback:
    - "https://v.recipes/dns-ecs#h3=true"
    - "https://v.recipes/dns-query#h3=true"
    - "https://v.recipes/dns/doh.dns.sb/dns-query#h3=true"
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - ::/128
      - ::1/128
      - 2001::/32
      - 0.0.0.0/32
      - 100.64.0.0/10
      - 127.0.0.0/8
      - 240.0.0.0/4
      - 255.255.255.255/32
    domain:
      - "+.google.com"
      - "+.googleapis.com"
      - "+.googlevideo.com"
      - "+.gstatic.com"
      - "+.facebook.com"
      - "+.youtube.com"
      - "+.github.com"
      - "+.githubusercontent.com"
  skip-cert-verify: false
  follow-rule: false
  ipv6: true
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "geosite:private"
    - "+.direct"
    - network-test.debian.org
    - detectportal.firefox.com
    - resolver1.opendns.com
    - "+.pub.3gppnetwork.org"
    - mesu.apple.com
    - swscan.apple.com
    - swquery.apple.com
    - swdownload.apple.com
    - swcdn.apple.com
    - swdist.apple.com
    - "+.nflxvideo.net"
    - "+.media.dssott.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.stun*.*"
    - "+.steamcontent.com"
    - "+.wotgame.cn"
    - "+.wggames.cn"
    - "+.wowsgame.cn"
    - "+.wargaming.net"
    - "+.srv.nintendo.net"
    - "*.n.n.srv.nintendo.net"
    - "+.cdn.nintendo.net"
    - lens.l.google.com
    - na.b.g-tun.com
    - "+.cmbchina.com"
    - "+.cmbimg.com"
    - "+.sandai.net"
    - "+.n0808.com"
    - "+.uu.163.com"
    - ps.res.netease.com
    - v.recipes
    - "+.v.recipes"
    - "rule-set:airport-domain"
    - "rule-set:DNS"
    - "rule-set:NTP-Service"
    - "rule-set:WeChat"
    - "rule-set:WeChat_Supplement"
    - "rule-set:XiaoHongShu"
    - "rule-set:Alibaba_Classical_No_Resolve"
    - "rule-set:GameDownloadCN"
    - "rule-set:ChinaMedia"
    - "rule-set:Download"
    - "geosite:cn"
    - "geosite:category-games@cn"
  nameserver-policy:
    "+.ndmdhs.com": 1.0.0.1
    "+.dutils.com": 114.114.114.114
    "+.hostbuf.com": 114.114.114.114
    "+.tw":
      - https://v.recipes/dns-ecs
      - https://v.recipes/dns-query
      - https://v.recipes/dns/doh.dns.sb/dns-query
    "+.jp":
      - https://v.recipes/dns-ecs
      - https://v.recipes/dns-query
      - https://v.recipes/dns/doh.dns.sb/dns-query
    "geosite:category-games@cn":
      - https://223.6.6.6/dns-query
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "rule-set:DNS,NTP-Service,WeChat,WeChat_Supplement,XiaoHongShu":
      - https://223.6.6.6/dns-query
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "rule-set:AppleMusic,GameRule,LG-Service,OpenAi,Qobuz,Japan_Media,KoreaMedia":
      - https://v.recipes/dns-ecs
      - https://v.recipes/dns-query
      - https://v.recipes/dns/doh.dns.sb/dns-query
    "geosite:category-ai-!cn,geolocation-!cn":
      - https://v.recipes/dns-ecs
      - https://v.recipes/dns-query
      - https://v.recipes/dns/doh.dns.sb/dns-query
    "geosite:apple,cloudflare,wikimedia,tiktok,pikpak,github,speedtest,sony,meta,google,microsoft,yahoo":
      - https://v.recipes/dns-ecs
      - https://v.recipes/dns-query
      - https://v.recipes/dns/doh.dns.sb/dns-query
    "geosite:apple-cn,cn,private":
      - https://223.6.6.6/dns-query
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

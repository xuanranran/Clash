  # > Xbox Cloud Gaming
  # www.xbox.com 也包含商店页面；其余优先限定到云服务和认证端点。
  - DOMAIN,catalog.gamepass.com
  - DOMAIN,device.auth.xboxlive.com
  - DOMAIN,sisu.xboxlive.com
  - DOMAIN,user.auth.xboxlive.com
  - DOMAIN,www.xbox.com
  - DOMAIN,xsts.auth.xboxlive.com
  - DOMAIN-SUFFIX,gssv-play-prod.xboxlive.com
  - DOMAIN-SUFFIX,play.xbox.com

  # > Xbox 共享微软登录
  # 同主机上的其他微软账号登录也会匹配。
  - DOMAIN,login.live.com
  - DOMAIN,login.microsoftonline.com
  - DOMAIN,logincdn.msauth.net

  # > PlayStation 云串流
  # 云服务域名及 PSN 配套域名；PlayStation 域名也会匹配商店、更新和下载。
  - DOMAIN,ca.account.sony.com
  - DOMAIN-SUFFIX,gaikai.com
  - DOMAIN-SUFFIX,playstation-cloud.com
  - DOMAIN-SUFFIX,playstation-cloud.net
  - DOMAIN-SUFFIX,playstation.com
  - DOMAIN-SUFFIX,playstation.net
  - DOMAIN-SUFFIX,playstationnetwork.com
  - DOMAIN-SUFFIX,sonyentertainmentnetwork.com


  # > Voodoo
  # 网络应用目录归类为 Voodoo 手游相关域名，不属于上述三家云游戏的专用域名。
  - DOMAIN-SUFFIX,voodoo-gaming.io

  # 云游戏平台的登录/调度和 UDP 媒体连接是不同流量；域名规则无法完整替代媒体 IP。
  # NVIDIA 官方 trusted IP 清单用于识别来自 GFN 的源地址，不等同于玩家串流目标 IP。
  # 不据历史单点抓包扩大为 /16，也不按单一 UDP 端口匹配全部应用。
